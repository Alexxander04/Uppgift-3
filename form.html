    <title>Betala</title>

<body>
    <header>
        <img id="banner" src="banner.jpg" alt="banner">
    </header>
    <nav>
        <h1><span class="gradient">Betala</span></h1>
        <ul>
            <li>
                <a href="start.html">Start</a>
            </li>
            <li>
                <a>Shop</a>
                <div class="dropdown">
                    <ul>
                        <li><a href="pc.html">PC</a></li>
                        <li><a href="nintendo.html">Nintendo</a></li>
                        <li><a href="xbox.html">Xbox</a></li>
                        <li><a href="playstation.html">Playstation</a></li>
                    </ul>

            <li><a href="om_oss.html">Om Oss</a></li>
        </ul>
    </nav>
    <main>
        <section id="forms">
            <div class="form">
                <form action="">
                    <div class="input">
                        <p id="betala">Betala</p>
                        <label for="namn">Förnamn:</label>
                        <input type="text" id="namn" recuired autocomplete="name" placeholder="Förnamn">
                    </div>

                    <div class="input">
                        <label for="efternamn">Efternamn:</label>
                        <input type="text" id="efternamn" recuired autocomplete="efternamn" placeholder="Efternamn">
                    </div>

                    <div class="input">
                        <label for="email">E-post:</label>
                        <input type="email" name="email" id="email" recuired autocomplete="email" placeholder="123@gmail.com">
                    </div>

                    <div class="input">
                        <label for="adress">Adress:</label>
                        <input type="text" name="adress" id="adress" recuired autocomplete="adress" placeholder="Adress">
                    </div>

                    <div class="input">
                        <label for="ort">Ort:</label>
                        <input type="text" name="ort" id="ort" recuired autocomplete="ort" placeholder="Ort">
                    </div>
                    <div class="input">
                        <label for="postnummer">Postnummer:</label>
                        <input type="number" name="postnummer" id="postnummer" recuired autocomplete="postnummer" placeholder="XXX XX">
                    </div>

                    <div class="input">
                        <label for="kortnummer">Kortnummer:</label>
                        <input type="number" name="kortnummer" id="kortnummer" recuired autocomplete="kortnummer" placeholder="XXXX XXXX XXXX XXXX">
                    </div>

                    <div class="input">
                        <label for="utgångsdatum">Utgångsdatum:</label>
                        <input type="date" name="utgångsdatum" id="utgångsdatum" recuired autocomplete="utgångsdatum">
                    </div>

                    <div class="input">
                        <label for="cvv">Cvv:</label>
                        <input type="number" name="cvv" id="utgångsdatum" recuired autocomplete="cvv" placeholder="XXX">
                    </div>

                    <div id="button_box">
                        <button type="submit" id="button">Beställ</button>
                    </div>



                </form>
            </div>
        </section>
        <aside>

        </aside>
    </main>
